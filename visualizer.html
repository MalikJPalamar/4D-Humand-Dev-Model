<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drift — generative ambient visualizer</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #05060a; }
  canvas { display: block; width: 100vw; height: 100vh; }

  #ui {
    position: fixed; inset: 0; pointer-events: none;
    font-family: ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
    color: rgba(235, 240, 255, 0.85);
    transition: opacity 1.2s ease;
  }
  body.idle #ui { opacity: 0; }

  #title {
    position: absolute; top: 28px; left: 34px; letter-spacing: 0.35em;
    font-size: 13px; font-weight: 600; text-transform: uppercase;
    opacity: 0.7;
  }
  #title small { display: block; letter-spacing: 0.12em; font-weight: 400; font-size: 10px; opacity: 0.6; margin-top: 6px; text-transform: none; }

  #controls {
    position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; pointer-events: auto;
    background: rgba(10, 12, 22, 0.55); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px; padding: 10px 18px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  button {
    font: inherit; color: inherit; background: transparent; border: none;
    cursor: pointer; border-radius: 999px; padding: 8px 16px;
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    transition: background 0.25s ease, color 0.25s ease, opacity 0.25s ease;
    opacity: 0.65;
  }
  button:hover { opacity: 1; background: rgba(255,255,255,0.06); }
  button.active { opacity: 1; background: rgba(255,255,255,0.12); }
  #playBtn {
    width: 46px; height: 46px; padding: 0; display: grid; place-items: center;
    border: 1px solid rgba(255,255,255,0.18); opacity: 0.9; font-size: 14px;
  }
  #playBtn svg { width: 16px; height: 16px; fill: currentColor; }
  .sep { width: 1px; height: 24px; background: rgba(255,255,255,0.12); }

  #vol { pointer-events: auto; -webkit-appearance: none; appearance: none;
    width: 90px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.18); outline: none; }
  #vol::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px; border-radius: 50%; background: rgba(235,240,255,0.85); cursor: pointer; }
  #vol::-moz-range-thumb { width: 12px; height: 12px; border: none; border-radius: 50%; background: rgba(235,240,255,0.85); cursor: pointer; }

  #hint {
    position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.35;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="ui">
  <div id="title">Drift<small>generative ambient</small></div>
  <div id="hint">space — play · 1 2 3 — moods</div>
  <div id="controls">
    <button id="playBtn" title="play / pause" aria-label="play or pause">
      <svg id="iconPlay" viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg>
      <svg id="iconPause" viewBox="0 0 16 16" style="display:none"><path d="M3 1.5h3.5v13H3zM9.5 1.5H13v13H9.5z"/></svg>
    </button>
    <div class="sep"></div>
    <button class="mood active" data-mood="calm">Calm</button>
    <button class="mood" data-mood="focus">Focus</button>
    <button class="mood" data-mood="epic">Epic</button>
    <div class="sep"></div>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.7" title="volume">
  </div>
</div>

<script>
"use strict";

/* ============================================================
   Drift — a single-file generative ambient machine.
   The music is composed live in code (Web Audio API, no samples)
   and every visual element is driven by what the engine is
   actually playing: scheduled note events + live spectrum data.
   ============================================================ */

// ---------------------------------------------------------------
// Mood presets — everything musical and visual derives from these.
// keyMidi: tonal center. chords: semitone stacks above the key.
// scale: melody pool (semitones). Steps are seconds between
// melody-grid ticks; densities are per-tick probabilities.
// ---------------------------------------------------------------
const MOODS = {
  calm: {
    keyMidi: 45,                       // A2
    chords: [
      [0, 7, 16, 23],                  // A add9 spread
      [5, 12, 21, 28],                 // D
      [9, 16, 24, 31],                 // F#m
      [4, 12, 19, 26],                 // C#m-ish color
    ],
    scale: [0, 2, 4, 7, 9],            // major pentatonic
    chordDur: 16,
    step: 0.8,
    pluckDensity: 0.14,
    bellDensity: 0.05,
    pulse: false,
    padType: "sine",
    padCutoff: 900,
    detune: 6,
    reverbSeconds: 6,
    delayBeats: 1.5,
    visual: {
      hue: 192, hueRange: 45, drift: 3,      // teal → soft violet
      speed: 0.45, rings: 5, dust: 110,
      glow: 0.5, trail: 0.075,
    },
  },
  focus: {
    keyMidi: 48,                       // C3
    chords: [
      [0, 3, 10, 14],                  // Cm9
      [5, 12, 17, 24],                 // F
      [10, 17, 22, 29],                // Bb
      [3, 10, 15, 22],                 // Eb
    ],
    scale: [0, 2, 3, 5, 7, 9, 10],     // dorian
    chordDur: 12,
    step: 0.42,
    pluckDensity: 0.34,
    bellDensity: 0.03,
    pulse: true,
    padType: "triangle",
    padCutoff: 700,
    detune: 4,
    reverbSeconds: 4,
    delayBeats: 1.0,
    visual: {
      hue: 248, hueRange: 60, drift: 2,      // indigo → cyan
      speed: 0.85, rings: 7, dust: 70,
      glow: 0.4, trail: 0.11,
    },
  },
  epic: {
    keyMidi: 38,                       // D2
    chords: [
      [0, 7, 15, 24],                  // Dm
      [8, 15, 20, 27],                 // Bb
      [3, 10, 19, 26],                 // F
      [10, 17, 24, 29],                // C
    ],
    scale: [0, 2, 3, 5, 7, 8, 10],     // aeolian
    chordDur: 14,
    step: 0.6,
    pluckDensity: 0.2,
    bellDensity: 0.08,
    pulse: false,
    boom: true,
    padType: "sawtooth",
    padCutoff: 420,
    detune: 11,
    reverbSeconds: 8,
    delayBeats: 1.5,
    visual: {
      hue: 18, hueRange: 40, drift: 4,       // ember → crimson gold
      speed: 0.6, rings: 6, dust: 150,
      glow: 0.75, trail: 0.06,
    },
  },
};

const midiToFreq = (m) => 440 * Math.pow(2, (m - 69) / 12);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const lerp = (a, b, t) => a + (b - a) * t;

// ================================================================
// AUDIO ENGINE
// ================================================================
const Engine = {
  ctx: null,
  master: null,
  analyser: null,
  reverb: null,
  reverbGain: null,
  delay: null,
  delayGain: null,
  running: false,
  moodName: "calm",
  mood: MOODS.calm,

  // scheduler state
  timer: null,
  nextStep: 0,
  nextChord: 0,
  chordIndex: 0,
  stepCount: 0,

  // events handed to the renderer: {t, kind, pitch, gain}
  events: [],

  init() {
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();

    this.master = this.ctx.createGain();
    this.master.gain.value = 0.7;

    const comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value = -22;
    comp.knee.value = 18;
    comp.ratio.value = 5;
    comp.attack.value = 0.01;
    comp.release.value = 0.35;

    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = 2048;
    this.analyser.smoothingTimeConstant = 0.82;

    this.master.connect(comp);
    comp.connect(this.analyser);
    this.analyser.connect(this.ctx.destination);

    // Feedback delay bus (tempo-flavored echoes for plucks)
    this.delay = this.ctx.createDelay(2.5);
    this.delay.delayTime.value = this.mood.step * this.mood.delayBeats;
    const fb = this.ctx.createGain(); fb.gain.value = 0.38;
    const damp = this.ctx.createBiquadFilter();
    damp.type = "lowpass"; damp.frequency.value = 2400;
    this.delay.connect(damp); damp.connect(fb); fb.connect(this.delay);
    this.delayGain = this.ctx.createGain(); this.delayGain.gain.value = 0.5;
    this.delay.connect(this.delayGain);
    this.delayGain.connect(this.master);

    // Reverb bus — impulse response is synthesized noise, no files
    this.reverb = this.ctx.createConvolver();
    this.reverbGain = this.ctx.createGain();
    this.reverbGain.gain.value = 0.9;
    this.reverb.connect(this.reverbGain);
    this.reverbGain.connect(this.master);
    this.buildReverb(this.mood.reverbSeconds);

    this.buildNoiseBed();
  },

  buildReverb(seconds) {
    const sr = this.ctx.sampleRate;
    const len = Math.floor(sr * seconds);
    const ir = this.ctx.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) {
      const data = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        // exponential decay + slight early-reflection shimmer
        const env = Math.pow(1 - i / len, 2.6);
        data[i] = (Math.random() * 2 - 1) * env;
      }
    }
    this.reverb.buffer = ir;
  },

  // Endless filtered-noise wash that breathes underneath everything
  buildNoiseBed() {
    const sr = this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, sr * 4, sr);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < d.length; i++) {           // cheap pink-ish noise
      const white = Math.random() * 2 - 1;
      last = 0.985 * last + 0.015 * white;
      d[i] = last * 4.5;
    }
    const src = this.ctx.createBufferSource();
    src.buffer = buf; src.loop = true;

    const bp = this.ctx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 320; bp.Q.value = 1.4;

    // slow LFO wanders the wash around the spectrum
    const lfo = this.ctx.createOscillator();
    lfo.frequency.value = 0.017;
    const lfoAmt = this.ctx.createGain(); lfoAmt.gain.value = 190;
    lfo.connect(lfoAmt); lfoAmt.connect(bp.frequency);

    this.noiseGain = this.ctx.createGain();
    this.noiseGain.gain.value = 0.0;
    src.connect(bp); bp.connect(this.noiseGain);
    this.noiseGain.connect(this.master);
    this.noiseGain.connect(this.reverb);
    src.start(); lfo.start();
  },

  setMood(name) {
    this.moodName = name;
    this.mood = MOODS[name];
    if (this.ctx) {
      this.buildReverb(this.mood.reverbSeconds);
      this.delay.delayTime.setTargetAtTime(
        this.mood.step * this.mood.delayBeats, this.ctx.currentTime, 0.5);
    }
  },

  start() {
    if (!this.ctx) this.init();
    this.ctx.resume();
    if (this.running) return;
    this.running = true;

    const t = this.ctx.currentTime + 0.1;
    this.nextStep = t;
    this.nextChord = t;
    this.stepCount = 0;
    this.noiseGain.gain.setTargetAtTime(0.05, t, 4);
    this.timer = setInterval(() => this.schedule(), 40);
  },

  stop() {
    if (!this.running) return;
    this.running = false;
    clearInterval(this.timer);
    this.noiseGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.8);
    this.ctx.suspend();
  },

  // Lookahead scheduler: keep ~0.4s of music queued at all times
  schedule() {
    const ahead = this.ctx.currentTime + 0.4;
    const m = this.mood;

    while (this.nextChord < ahead) {
      this.playChord(this.nextChord);
      this.nextChord += m.chordDur * rand(0.9, 1.1);
    }

    while (this.nextStep < ahead) {
      this.stepTick(this.nextStep);
      this.nextStep += m.step;
      this.stepCount++;
    }
  },

  stepTick(t) {
    const m = this.mood;
    if (Math.random() < m.pluckDensity) {
      const deg = pick(m.scale);
      const oct = pick([12, 24, 24, 36]);
      this.pluck(t, m.keyMidi + deg + oct);
    }
    if (Math.random() < m.bellDensity) {
      const deg = pick(m.scale);
      this.bell(t, m.keyMidi + deg + 36 + (Math.random() < 0.4 ? 12 : 0));
    }
    if (m.pulse && this.stepCount % 4 === 0) {
      this.pulse(t);
    }
  },

  // --- voices ----------------------------------------------------

  playChord(t) {
    const m = this.mood;
    const chord = m.chords[this.chordIndex % m.chords.length];
    this.chordIndex++;
    const dur = m.chordDur * 1.35;             // overlap = seamless crossfade
    const attack = dur * 0.32, release = dur * 0.45;

    const filt = this.ctx.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.setValueAtTime(m.padCutoff * 0.5, t);
    filt.frequency.linearRampToValueAtTime(m.padCutoff * 1.4, t + dur * 0.5);
    filt.frequency.linearRampToValueAtTime(m.padCutoff * 0.5, t + dur);
    filt.Q.value = 0.7;

    const env = this.ctx.createGain();
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(0.16, t + attack);
    env.gain.setValueAtTime(0.16, t + dur - release);
    env.gain.linearRampToValueAtTime(0, t + dur);

    filt.connect(env);
    env.connect(this.master);
    const wet = this.ctx.createGain(); wet.gain.value = 0.6;
    env.connect(wet); wet.connect(this.reverb);

    for (const semis of chord) {
      for (const sign of [-1, 1]) {            // detuned pair per tone
        const osc = this.ctx.createOscillator();
        osc.type = m.padType;
        osc.frequency.value = midiToFreq(m.keyMidi + semis);
        osc.detune.value = sign * m.detune * rand(0.6, 1.4);
        const g = this.ctx.createGain();
        g.gain.value = 1 / (chord.length * 2);
        osc.connect(g); g.connect(filt);
        osc.start(t); osc.stop(t + dur + 0.1);
      }
    }

    // sub bass root
    const sub = this.ctx.createOscillator();
    sub.type = "sine";
    sub.frequency.value = midiToFreq(m.keyMidi + chord[0] - 12);
    const sg = this.ctx.createGain();
    sg.gain.setValueAtTime(0, t);
    sg.gain.linearRampToValueAtTime(0.11, t + attack);
    sg.gain.setValueAtTime(0.11, t + dur - release);
    sg.gain.linearRampToValueAtTime(0, t + dur);
    sub.connect(sg); sg.connect(this.master);
    sub.start(t); sub.stop(t + dur + 0.1);

    if (m.boom) this.boom(t);

    this.events.push({ t, kind: "chord", pitch: m.keyMidi + chord[0], gain: 1 });
  },

  pluck(t, midi) {
    const f = midiToFreq(midi);
    const osc = this.ctx.createOscillator();
    osc.type = Math.random() < 0.5 ? "sine" : "triangle";
    osc.frequency.value = f;

    const g = this.ctx.createGain();
    const peak = rand(0.05, 0.11);
    const decay = rand(1.2, 2.6);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);

    osc.connect(g);
    g.connect(this.master);
    const wet = this.ctx.createGain(); wet.gain.value = 0.7;
    g.connect(wet); wet.connect(this.reverb);
    const echo = this.ctx.createGain(); echo.gain.value = 0.5;
    g.connect(echo); echo.connect(this.delay);
    osc.start(t); osc.stop(t + decay + 0.1);

    this.events.push({ t, kind: "pluck", pitch: midi, gain: peak / 0.11 });
  },

  bell(t, midi) {
    // two-operator FM chime: quiet, glassy, far away
    const f = midiToFreq(midi);
    const car = this.ctx.createOscillator(); car.frequency.value = f;
    const mod = this.ctx.createOscillator(); mod.frequency.value = f * 2.76;
    const mg = this.ctx.createGain();
    mg.gain.setValueAtTime(f * 1.4, t);
    mg.gain.exponentialRampToValueAtTime(1, t + 2.2);
    mod.connect(mg); mg.connect(car.frequency);

    const g = this.ctx.createGain();
    const peak = rand(0.02, 0.045);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 3.5);

    car.connect(g);
    g.connect(this.master);
    const wet = this.ctx.createGain(); wet.gain.value = 1.1;
    g.connect(wet); wet.connect(this.reverb);
    car.start(t); car.stop(t + 3.8);
    mod.start(t); mod.stop(t + 3.8);

    this.events.push({ t, kind: "bell", pitch: midi, gain: peak / 0.045 });
  },

  pulse(t) {
    // soft heartbeat blip that keeps focus mode gently ticking
    const osc = this.ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(190, t);
    osc.frequency.exponentialRampToValueAtTime(95, t + 0.12);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.045, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + 0.35);

    this.events.push({ t, kind: "pulse", pitch: 45, gain: 0.6 });
  },

  boom(t) {
    // slow cinematic swell under epic chord changes
    const osc = this.ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(72, t);
    osc.frequency.exponentialRampToValueAtTime(30, t + 1.4);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.16, t + 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.8);
    osc.connect(g); g.connect(this.master);
    const wet = this.ctx.createGain(); wet.gain.value = 0.5;
    g.connect(wet); wet.connect(this.reverb);
    osc.start(t); osc.stop(t + 3);

    this.events.push({ t, kind: "boom", pitch: 26, gain: 1 });
  },

  // Renderer pulls events whose time has arrived
  dueEvents() {
    if (!this.ctx) return [];
    const now = this.ctx.currentTime;
    const due = [];
    this.events = this.events.filter((e) => {
      if (e.t <= now) { due.push(e); return false; }
      return true;
    });
    return due;
  },
};

// ================================================================
// RENDERER — everything on screen is a function of the audio
// ================================================================
const canvas = document.getElementById("scene");
const gfx = canvas.getContext("2d");
let W = 0, H = 0, CX = 0, CY = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  gfx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
}
window.addEventListener("resize", resize);
resize();

const freqData = new Uint8Array(1024);
const waveData = new Uint8Array(2048);

const Vis = {
  hue: MOODS.calm.visual.hue,
  targetHue: MOODS.calm.visual.hue,
  cfg: MOODS.calm.visual,
  targetCfg: MOODS.calm.visual,
  mix: 1,                     // preset crossfade progress
  bass: 0, mid: 0, treble: 0, level: 0,
  rot: 0,
  breathe: 0,
  particles: [],
  ripples: [],
  dust: [],
  time: 0,

  setMood(name) {
    this.targetCfg = MOODS[name].visual;
    this.targetHue = MOODS[name].visual.hue;
    this.mix = 0;
  },

  seedDust() {
    this.dust = [];
    for (let i = 0; i < 160; i++) {
      this.dust.push({
        x: Math.random() * W, y: Math.random() * H,
        z: rand(0.2, 1),                 // depth → size + speed
        a: rand(0, Math.PI * 2),
        w: rand(0.1, 0.5),
      });
    }
  },

  analyse() {
    if (!Engine.analyser) return;
    Engine.analyser.getByteFrequencyData(freqData);
    Engine.analyser.getByteTimeDomainData(waveData);

    const band = (a, b) => {
      let s = 0;
      for (let i = a; i < b; i++) s += freqData[i];
      return s / (b - a) / 255;
    };
    // ~23 Hz per bin at 48 kHz
    this.bass = lerp(this.bass, band(1, 11), 0.12);
    this.mid = lerp(this.mid, band(11, 90), 0.1);
    this.treble = lerp(this.treble, band(90, 320), 0.1);
    this.level = lerp(this.level, band(1, 320), 0.08);
  },

  spawnFromEvents() {
    for (const e of Engine.dueEvents()) {
      if (e.kind === "pluck") {
        // pitch decides the orbit radius; high notes bloom far out
        const ang = rand(0, Math.PI * 2);
        const r = lerp(0.14, 0.42, Math.min(1, (e.pitch - 45) / 48)) * Math.min(W, H);
        const n = 5 + (e.gain * 9) | 0;
        for (let i = 0; i < n; i++) {
          this.particles.push({
            x: CX + Math.cos(ang) * r, y: CY + Math.sin(ang) * r,
            vx: rand(-0.5, 0.5), vy: rand(-0.5, 0.5),
            spin: rand(-0.02, 0.02), ang,
            life: 1, decay: rand(0.004, 0.01),
            size: rand(1.2, 3.2) * (0.6 + e.gain),
            hueOff: rand(-25, 25),
          });
        }
      } else if (e.kind === "bell") {
        this.ripples.push({ r: 20, v: 1.6, life: 1, decay: 0.006, width: 1.5, hueOff: 40 });
      } else if (e.kind === "chord") {
        this.ripples.push({ r: 10, v: 3.2, life: 1, decay: 0.004, width: 3, hueOff: 0 });
      } else if (e.kind === "boom") {
        this.ripples.push({ r: 5, v: 5.5, life: 1, decay: 0.008, width: 6, hueOff: -14 });
        this.breathe = 1;
      } else if (e.kind === "pulse") {
        this.ripples.push({ r: 30, v: 0.9, life: 0.5, decay: 0.02, width: 1, hueOff: 15 });
      }
    }
  },

  draw(dt) {
    this.time += dt;
    this.mix = Math.min(1, this.mix + dt * 0.35);
    const c = this.cfg = {
      hue: 0, // handled separately for shortest-path drift
      hueRange: lerp(this.cfg.hueRange, this.targetCfg.hueRange, this.mix),
      drift: lerp(this.cfg.drift, this.targetCfg.drift, this.mix),
      speed: lerp(this.cfg.speed, this.targetCfg.speed, this.mix),
      rings: Math.round(lerp(this.cfg.rings, this.targetCfg.rings, this.mix)),
      dust: lerp(this.cfg.dust, this.targetCfg.dust, this.mix),
      glow: lerp(this.cfg.glow, this.targetCfg.glow, this.mix),
      trail: lerp(this.cfg.trail, this.targetCfg.trail, this.mix),
    };
    // hue takes the short way around the wheel
    let dh = ((this.targetHue - this.hue + 540) % 360) - 180;
    this.hue += dh * Math.min(1, dt * 0.7);
    const baseHue = (this.hue + Math.sin(this.time * 0.03) * c.drift * 8) % 360;

    this.analyse();
    this.spawnFromEvents();
    this.breathe *= 0.985;

    this.rot += dt * c.speed * (0.15 + this.mid * 1.6);

    // trail fade — the source of the hypnotic smear
    gfx.globalCompositeOperation = "source-over";
    gfx.fillStyle = `rgba(4, 5, 10, ${c.trail})`;
    gfx.fillRect(0, 0, W, H);

    gfx.globalCompositeOperation = "lighter";

    this.drawGlowCore(baseHue, c);
    this.drawDust(baseHue, c);
    this.drawMandala(baseHue, c);
    this.drawWaveRing(baseHue, c);
    this.drawRipples(baseHue);
    this.drawParticles(baseHue);
  },

  drawGlowCore(hue, c) {
    const r = Math.min(W, H) * (0.16 + this.bass * 0.3 + this.breathe * 0.15);
    const g = gfx.createRadialGradient(CX, CY, 0, CX, CY, r);
    g.addColorStop(0, `hsla(${hue}, 85%, 62%, ${0.10 * c.glow + this.bass * 0.1})`);
    g.addColorStop(0.6, `hsla(${(hue + 25) % 360}, 80%, 50%, ${0.05 * c.glow})`);
    g.addColorStop(1, "hsla(0, 0%, 0%, 0)");
    gfx.fillStyle = g;
    gfx.fillRect(CX - r, CY - r, r * 2, r * 2);
  },

  drawDust(hue, c) {
    const count = Math.min(this.dust.length, c.dust | 0);
    for (let i = 0; i < count; i++) {
      const p = this.dust[i];
      p.a += p.w * 0.002;
      p.x += Math.cos(p.a) * p.z * 0.25;
      p.y += Math.sin(p.a) * p.z * 0.25 - p.z * 0.08;
      if (p.x < -5) p.x = W + 5; if (p.x > W + 5) p.x = -5;
      if (p.y < -5) p.y = H + 5; if (p.y > H + 5) p.y = -5;
      const tw = 0.25 + this.treble * 1.6 * p.z;
      gfx.fillStyle = `hsla(${(hue + 30) % 360}, 60%, 75%, ${0.08 * tw})`;
      gfx.beginPath();
      gfx.arc(p.x, p.y, p.z * 1.4, 0, Math.PI * 2);
      gfx.fill();
    }
  },

  // Concentric rotating dashed rings — the mandala breathes on bass
  drawMandala(hue, c) {
    const base = Math.min(W, H) * 0.09;
    for (let i = 0; i < c.rings; i++) {
      const t = i / c.rings;
      const r = base + t * Math.min(W, H) * 0.34 * (1 + this.bass * 0.22 + this.breathe * 0.1);
      const segs = 3 + i * 2;
      const gap = (Math.PI * 2) / segs;
      const arc = gap * (0.35 + this.mid * 0.45);
      const dir = i % 2 ? 1 : -1;
      const a0 = this.rot * dir * (0.4 + t);
      gfx.strokeStyle = `hsla(${(hue + t * c.hueRange) % 360}, 80%, ${58 + t * 12}%, ${0.20 + this.level * 0.4})`;
      gfx.lineWidth = 1.4 + (1 - t) * 1.4 + this.bass * 2;
      gfx.lineCap = "round";
      for (let s = 0; s < segs; s++) {
        gfx.beginPath();
        gfx.arc(CX, CY, r, a0 + s * gap, a0 + s * gap + arc);
        gfx.stroke();
      }
    }
  },

  // The actual output waveform, bent into a circle
  drawWaveRing(hue, c) {
    const R = Math.min(W, H) * 0.30 * (1 + this.bass * 0.1);
    const amp = Math.min(W, H) * 0.06;
    gfx.strokeStyle = `hsla(${(hue + c.hueRange * 0.5) % 360}, 90%, 68%, ${0.16 + this.level * 0.5})`;
    gfx.lineWidth = 1.2;
    gfx.beginPath();
    const N = 180;
    for (let i = 0; i <= N; i++) {
      const idx = ((i / N) * (waveData.length - 1)) | 0;
      const v = (waveData[idx] - 128) / 128;
      const a = (i / N) * Math.PI * 2 + this.rot * 0.25;
      const r = R + v * amp;
      const x = CX + Math.cos(a) * r, y = CY + Math.sin(a) * r;
      i ? gfx.lineTo(x, y) : gfx.moveTo(x, y);
    }
    gfx.closePath();
    gfx.stroke();
  },

  drawRipples(hue) {
    this.ripples = this.ripples.filter((r) => r.life > 0);
    for (const r of this.ripples) {
      r.r += r.v;
      r.life = Math.max(0, r.life - r.decay);
      gfx.strokeStyle = `hsla(${(hue + r.hueOff + 360) % 360}, 85%, 65%, ${r.life * 0.35})`;
      gfx.lineWidth = r.width * r.life;
      gfx.beginPath();
      gfx.arc(CX, CY, r.r, 0, Math.PI * 2);
      gfx.stroke();
    }
  },

  drawParticles(hue) {
    this.particles = this.particles.filter((p) => p.life > 0);
    for (const p of this.particles) {
      // gentle spiral drift around the center
      const dx = p.x - CX, dy = p.y - CY;
      p.x += p.vx + -dy * p.spin;
      p.y += p.vy + dx * p.spin;
      p.life = Math.max(0, p.life - p.decay);
      const a = p.life * p.life * 0.85;
      gfx.fillStyle = `hsla(${(hue + p.hueOff + 360) % 360}, 90%, 70%, ${a})`;
      gfx.beginPath();
      gfx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      gfx.fill();
    }
  },
};
Vis.seedDust();

let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  Vis.draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ================================================================
// UI
// ================================================================
const playBtn = document.getElementById("playBtn");
const iconPlay = document.getElementById("iconPlay");
const iconPause = document.getElementById("iconPause");
const vol = document.getElementById("vol");

function togglePlay() {
  if (Engine.running) {
    Engine.stop();
  } else {
    Engine.start();
    Engine.master.gain.value = parseFloat(vol.value);
  }
  iconPlay.style.display = Engine.running ? "none" : "";
  iconPause.style.display = Engine.running ? "" : "none";
}

function setMood(name) {
  Engine.setMood(name);
  Vis.setMood(name);
  document.querySelectorAll(".mood").forEach((b) =>
    b.classList.toggle("active", b.dataset.mood === name));
}

playBtn.addEventListener("click", togglePlay);
document.querySelectorAll(".mood").forEach((b) =>
  b.addEventListener("click", () => setMood(b.dataset.mood)));
vol.addEventListener("input", () => {
  if (Engine.master)
    Engine.master.gain.setTargetAtTime(parseFloat(vol.value), Engine.ctx.currentTime, 0.05);
});

window.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.key === "1") setMood("calm");
  else if (e.key === "2") setMood("focus");
  else if (e.key === "3") setMood("epic");
});

// UI fades away when the mouse goes quiet — second-monitor mode
let idleTimer = null;
function wake() {
  document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add("idle"), 3500);
}
["mousemove", "mousedown", "touchstart", "keydown"].forEach((ev) =>
  window.addEventListener(ev, wake));
wake();
</script>
</body>
